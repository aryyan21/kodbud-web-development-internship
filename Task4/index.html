<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Image Gallery</title>
  <style>
    /* -----------------------------------
       Base Reset & Styles
    ----------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.025em;
    }

    header p {
      color: #64748b;
      margin-top: 0.5rem;
      font-size: 1.1rem;
    }

    /* -----------------------------------
       Gallery Grid Layout
    ----------------------------------- */
    .gallery {
      display: grid;
      gap: 1.5rem;
      /* Default (Mobile): 1 column */
      grid-template-columns: 1fr;
    }

    /* Tablet: 2 columns */
    @media (min-width: 640px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Desktop: 3 columns */
    @media (min-width: 1024px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* -----------------------------------
       Card & Image Styling
    ----------------------------------- */
    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background-color: #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 
                  0 2px 4px -2px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.12), 
                  0 4px 6px -4px rgba(0, 0, 0, 0.08);
    }

    .gallery-item img {
      width: 100%;
      /* Enforces uniform height regardless of source image shape */
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    /* Hover caption overlay */
    .gallery-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.25rem 1rem 0.75rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .gallery-item:hover .gallery-caption {
      opacity: 1;
    }

    .gallery-caption h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .gallery-caption span {
      font-size: 0.85rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Curated Gallery</h1>
      <p>A responsive image grid built with CSS Grid</p>
    </header>

    <main class="gallery">
      <!-- Image 1 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" 
          alt="Misty mountain valley with a river running through it"
          loading="lazy"
        />
        <figcaption class="gallery-caption">
          <h3>Yosemite Valley</h3>
          <span>Nature</span>
        </figcaption>
      </figure>

      <!-- Image 2 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" 
          alt="Foggy forest hills during golden hour"
          loading="lazy"
        />
        <figcaption class="gallery-caption">
          <h3>Morning Fog</h3>
          <span>Landscape</span>
        </figcaption>
      </figure>

      <!-- Image 3 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" 
          alt="Sunlight filtering through dense trees in a forest"
          loading="lazy"
        />
        <figcaption class="gallery-caption">
          <h3>Sunlit Woods</h3>
          <span>Nature</span>
        </figcaption>
      </figure>

      <!-- Image 4 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" 
          alt="Tropical beach with turquoise water and white sand"
          loading="lazy"
        />
        <figcaption class="gallery-caption">
          <h3>Coastal Serenity</h3>
          <span>Ocean</span>
        </figcaption>
      </figure>

      <!-- Image 5 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80" 
          alt="Snowy mountain peaks under a starry night sky"
          loading="lazy"
        />
        <figcaption class="gallery-caption">
          <h3>Starry Peaks</h3>
          <span>Mountains</span>
        </figcaption>
      </figure>

      <!-- Image 6 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80" 
          alt="Rolling green hills under morning sunlight"
          loading="lazy"
        />
        <figcaption class="gallery-caption">
          <h3>Rolling Greens</h3>
          <span>Meadow</span>
        </figcaption>
      </figure>
    </main>
  </div>

</body>
</html>
